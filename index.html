.groups { display: flex; flex-direction: column; gap: 12px; }
.group b { display: block; font-size: 12px; color: var(--dim); margin-bottom: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.chips button.on { background: var(--primary); border-color: var(--primary); color: #FFFFFF; }
.tip { font-size: 13px; color: var(--dim); line-height: 1.6; }
#fab { display: none; position: fixed; right: 0; top: 50%; margin-top: -36px; z-index: 20; width: 24px; height: 72px; border-radius: 12px 0 0 12px; border: 0; background: rgba(27,48,77,0.82); color: #FFFFFF; box-shadow: -2px 4px 12px rgba(0,0,0,0.35); cursor: pointer; align-items: center; justify-content: center; padding: 0; }

  constructor(props) {
    super(props);
    this.plays = 2;
    this.state = this.fresh();
  }
  fresh() { return { t: 0, r: 0, x: 187, lives: 3, pts: 0, maxR: 0, got: {}, over: false, win: false, started: false, toast: '', toastT: 0, splash: null, hop: 0 }; }
  componentDidMount() { this._iv = setInterval(() => this.tick(), 40); }
  componentWillUnmount() { clearInterval(this._iv); }
  // 물길 1~7: 방향 · 속도(px/틱) · 연꽃 시작 x · 코인 있는 연꽃
  get LANES() {
    return [
      null,
      { d: 1, v: 1.4, pads: [20, 190, 360], coin: -1 },
      { d: -1, v: 2.0, pads: [60, 300], coin: 1 },
      { d: 1, v: 1.0, pads: [0, 165, 330], coin: -1 },
      { d: -1, v: 1.7, pads: [90, 260, 420], coin: 2 },
      { d: 1, v: 2.4, pads: [30, 280], coin: -1 },
      { d: -1, v: 1.2, pads: [10, 175, 340], coin: 0 },
      { d: 1, v: 1.8, pads: [120, 360], coin: -1 }
    ];
  }
  rowY(r) { return 684 - r * 64; }
  padX(lane, i, t) {
    const W = 495, raw = lane.pads[i] + lane.d * lane.v * t;
    return ((raw % W) + W) % W - 60;
  }
  padAt(r, x, t) {
    const lane = this.LANES[r];
    for (let i = 0; i < lane.pads.length; i++) {
      const px = this.padX(lane, i, t);
      if (x >= px - 4 && x <= px + 92) return i;
    }
    return -1;
  }
  say(toast) { return { toast, toastT: 28 }; }
  fall(s, x) {
    const lives = s.lives - 1;
    const splash = { x, y: this.rowY(s.r), k: s.t };
    if (lives <= 0) return Object.assign({ lives: 0, over: true, splash }, this.say('풍덩! 게임 끝'));
    return Object.assign({ lives, r: 0, x: 187, splash }, this.say('풍덩! 하트 -1'));
  }
  land(s, r, x) {
    if (r >= 8) return { r: 8, x: 187, win: true, pts: s.pts + 50, maxR: 8 };
    const patch = { r, x, started: true, hop: s.t };
    if (r > s.maxR) { patch.maxR = r; patch.pts = s.pts + 1; }
    if (r === 0) return patch;
    const i = this.padAt(r, x, s.t);
    if (i < 0) return Object.assign({}, patch, this.fall(Object.assign({}, s, { r }), x));
    const key = r + '-' + i, lane = this.LANES[r];
    if (lane.coin === i && !s.got[key]) {
      patch.got = Object.assign({}, s.got, { [key]: 1 });
      patch.pts = (patch.pts || s.pts) + 5;
      Object.assign(patch, this.say('연꽃 코인 +5P'));
    }
    return patch;
  }
  move(dr, dx) {
    const s = this.state;
    if (s.over || s.win) return;
    const r = Math.max(0, s.r + dr);
    let x = s.x + dx * 75;
    if (r === 0 || r === 8) x = Math.round((x - 37) / 75) * 75 + 37;
    x = Math.max(37, Math.min(337, x));
    this.setState(this.land(s, r, x));
  }
  tick() {
    const s = this.state;
    if (s.over || s.win) return;
    const t = s.t + 1, patch = { t, toastT: Math.max(0, s.toastT - 1) };
    if (!patch.toastT) patch.toast = '';
    if (s.r >= 1 && s.r <= 7) {
      const lane = this.LANES[s.r], x = s.x + lane.d * lane.v;
      if (x < 8 || x > 367) Object.assign(patch, this.fall(s, x));
      else patch.x = x;
    }
    this.setState(patch);
  }
  restart() {
    if (this.plays > 0) this.plays--;
    this.setState(this.fresh());
  }
  renderVals() {
    const { t, r, x, lives, pts, maxR, got, over, win, started, toast, splash, hop } = this.state;
    const L = this.LANES;
    const lanes = [];
    for (let k = 1; k <= 7; k++) {
      const lane = L[k], y = this.rowY(k) - 32;
      const pads = lane.pads.map((b, i) => ({
        coin: lane.coin === i && !got[k + '-' + i],
        style: 'position: absolute; left: ' + this.padX(lane, i, t).toFixed(1) + 'px; top: 12px; width: 88px; height: 40px'
      }));
      const ph = ((lane.d * lane.v * t) % 40 + 40) % 40;
      let wave = '';
      for (let wx = -40 + ph; wx < 400; wx += 40) wave += 'M' + wx.toFixed(1) + ' ' + (k % 2 ? 22 : 44) + 'q10 -6 20 0';
      lanes.push({
        pads, wave, dirText: lane.d > 0 ? '›' : '‹',
        style: 'position: absolute; left: 0; right: 0; top: ' + y + 'px; height: 64px; overflow: hidden; background: ' + (k % 2 ? '#1D4A4F' : '#1A4347'),
        arrow: 'position: absolute; ' + (lane.d > 0 ? 'right: 4px' : 'left: 4px') + '; top: 20px; font-size: 18px; font-weight: 800; color: #4F8F94; pointer-events: none'
      });
    }
    const done = over || win;
    const sec = Math.max(0, 60 - Math.floor(t * 0.04));
    const leftAfter = Math.max(0, this.plays - 1);
    const py = this.rowY(Math.min(r, 8));
    return {
      lanes, pts, maxR, done, leftAfter, idle: !started && !done,
      score: maxR * 10 + Object.keys(got).length * 20 + (win ? 100 : 0),
      hearts: [0, 1, 2].map((i) => (i < lives ? '#F7A8C0' : '#2E4A4E')),
      livesLabel: '남은 목숨 ' + lives,
      toGoal: 8 - Math.min(r, 8),
      timeText: '00:' + String(sec).padStart(2, '0'),
      playsText: this.plays + ' / 3',
      againLabel: leftAfter > 0 ? '한 판 더 (' + leftAfter + '판 남음)' : '광고 보고 한 판 더',
      toast, toastOn: !!toast,
      splashOn: !!splash && t - splash.k < 18,
      splashStyle: splash ? 'position: absolute; left: ' + (splash.x - 30) + 'px; top: ' + (splash.y - 30) + 'px; width: 60px; height: 60px; border-radius: 50%; border: 3px solid #A8E0E3; box-sizing: border-box; pointer-events: none' : '',
      hopClass: t - hop < 6 ? 'hb-hop' : '',
      playerStyle: 'position: absolute; left: ' + (x - 26).toFixed(1) + 'px; top: ' + (py - 28) + 'px; width: 52px; height: 52px; pointer-events: none; filter: drop-shadow(0 3px 2px rgba(0,0,0,0.35))',
      doneTitle: win ? '난자 도착! +50P' : '물에 빠졌어요',
      cardStyle: 'position: absolute; left: 32px; right: 32px; top: 300px; box-sizing: border-box; padding: 20px; border-radius: 18px; background: #1B304D; border: 2px solid ' + (win ? '#F5C04F' : '#A8E0E3') + '; box-shadow: 0 12px 28px rgba(0,0,0,0.45); display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center',
      goUp: () => this.move(1, 0),
      goLeft: () => this.move(0, -1),
      goRight: () => this.move(0, 1),

  componentDidMount() { this.setState({ t: 0, guide: false }); this.timer = setInterval(() => { const s = this.state || {}; this.setState({ t: Math.min(17.5, (s.t || 0) + 0.05) }); }, 50); }

        ['달빛산책', 'cea2e213f956dc86fc1f2b61bb49e470', 0.91, 0.01], ['숲속러너', '6992c3155a3c16281b1d076ca6bfcdb3', 0.89, 0.0], ['나비날개', 'c7c7feeb95530bc2c06cafe869bd0e36', 0.87, 0.01], ['물결소리', 'e485b7582a99e865cc20aae7dd2e29e7', 0.84, 0.0]],

        [0.85, 0.93, '마지막 스퍼트!', '결승선이 가까워요 · 속도 파츠 효과', '#F5C04F'], [0.93, 1.1, '순위 역전!', '달리는콩 · 2위로 올라섰어요', '#4FE3C1']],
      shieldAt: 0.4, gear: [['속도 파츠 +15', 'stat'], ['실드', 'item']]
    };
    // 코스 3종 · 같은 경로 함수로 본 화면과 미니맵을 그려요 (V5_Maps · R01과 동일)
    const COURSES = {
      wave: { name: '물결 회랑', no: 'COURSE 01', bg: '#0F4A55', road: '#16636E', line: '#4FD1C5', f: (s) => 187 + 72 * Math.sin(2 * Math.PI * 2 * s), decor: 'weed',

      maze: { name: '면역 미로', no: 'COURSE 02', bg: '#3A2650', road: '#4B3266', line: '#B39DDB', f: (s) => 187 + 82 * Math.sin(2 * Math.PI * 2.5 * s + 0.6), decor: 'blob',
        obs: [[0.13, -45, 'cell'], [0.2, 40, 'cell'], [0.3, -10, 'cell'], [0.41, 50, 'cell'], [0.5, -45, 'cell'], [0.6, 15, 'cell'], [0.7, -40, 'cell'], [0.79, 45, 'cell'], [0.88, -5, 'cell']] },

    for (let s = s0; s <= s1 + 1e-9; s += 0.005) pts.push(s);

    const half = { bar: [37, 5], flow: [22, 15], cell: [22, 22], swirl: [22, 22], spike: [20, 13] };

    const finY = sy(1);
    const ev = CFG.events.find(([a, b]) => x >= a && x < b && !done);

function fit() {
  const mobile = innerWidth < 900;
  const k = mobile ? Math.min(innerWidth / 375, innerHeight / 812) : Math.min(1.1, (innerHeight - 48) / 812);
  phone.style.transform = 'scale(' + k + ')';
  const f = $('#frame'); f.style.width = 375 * k + 'px'; f.style.height = 812 * k + 'px';
  document.body.style.background = mobile ? '#20242B' : '';
}
addEventListener('resize', fit); fit();

const first = idOf(location.hash.slice(1)) || START;
history.replaceState({ id: first, depth: 0 }, '', '#' + keyOf(first));
document.fonts.load('700 16px Pretendard', '하고보고').catch(() => {}).then(() => show(first));
</script>
